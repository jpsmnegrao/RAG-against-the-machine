# Tells mypy to skip the virtual environment when running `mypy .`.
# Without this, mypy would type-check every package installed in the
# venv and produce hundreds of unrelated errors.

[mypy]
exclude = ^(venv|\.venv|build|llm_sdk|\.uv-cache|\.hf-cache|\.torch-cache|data/)
python_version = 3.10
ignore_missing_imports = True