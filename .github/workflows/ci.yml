# CI pipeline: runs tests and lint checks on every push and pull request. It
# installs the project dependencies with uv, runs pytest, and runs the linting
# checks defined in the Makefile.

name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: true
          
      - name: Set up python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Run lint
        run: make lint