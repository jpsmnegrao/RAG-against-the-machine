# Project packaging configuration
# Defines project metadata

[project]
name = "RAG-against-the-machine"
version = "1.0.0"
description = "Retrieval-Augmented Generation system"
requires-python = ">=3.10"
authors = [{name = "jpaim-so"}]
readme = "README.md"

dependencies = [
    "accelerate>=1.15.0",
    "bm25s>=0.3.11",
    "fire>=0.7.1",
	"langchain-text-splitters>=0.2.0",
    "pydantic>=2.0",
    "tqdm>=4.66.0",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "mypy",
    "flake8",
    "langchain-text-splitters",
	"pytest",
]
